# Run this as the portfolio's own Nginx instance.
worker_processes 1;
pid /run/personal-portfolio-gateway/nginx.pid;
error_log stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path /run/personal-portfolio-gateway/client-body;
    proxy_temp_path /run/personal-portfolio-gateway/proxy;
    fastcgi_temp_path /run/personal-portfolio-gateway/fastcgi;
    uwsgi_temp_path /run/personal-portfolio-gateway/uwsgi;
    scgi_temp_path /run/personal-portfolio-gateway/scgi;
    server_tokens off;

    upstream portfolio_app {
        server unix:/run/personal-portfolio/gunicorn.sock;
    }

    server {
        listen 127.0.0.1:8080;
        server_name prajwalramgowda.xyz;
        set_real_ip_from 127.0.0.1;
        real_ip_header CF-Connecting-IP;

        if ($host != prajwalramgowda.xyz) { return 421; }
        if ($http_x_forwarded_proto != https) { return 308 https://prajwalramgowda.xyz$request_uri; }

        location / {
            open_file_cache off;
            error_page 503 = @portfolio_maintenance;
            if (-f /srv/personal-portfolio/maintenance) { return 503; }

            client_max_body_size 5m;
            proxy_pass http://portfolio_app;
            proxy_intercept_errors off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location @portfolio_maintenance {
            default_type text/plain;
            add_header X-Portfolio-Maintenance 1 always;
            add_header Retry-After 30 always;
            add_header Cache-Control no-store always;
            return 503 "The portfolio is being updated. Please try again shortly.";
        }
    }
}
