# Include inside the public HTTPS server block. Replace any competing location / block.
location / {
    open_file_cache off;
    error_page 503 = @portfolio_maintenance;
    if (-f /var/lib/personalportfolio-gate/maintenance) { return 503; }

    client_max_body_size 5m;
    proxy_pass http://127.0.0.1:5000;
    proxy_intercept_errors off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @portfolio_maintenance {
    default_type text/plain;
    add_header X-Portfolio-Maintenance 1 always;
    add_header Retry-After 30 always;
    add_header Cache-Control no-store always;
    return 503 "The portfolio is being updated. Please try again shortly.";
}
