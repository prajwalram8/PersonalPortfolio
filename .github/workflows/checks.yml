name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check fresh migrations
        run: |
          export PORTFOLIO_DATABASE="$RUNNER_TEMP/portfolio.sqlite"
          python -m flask --app wsgi db upgrade
          python -m flask --app wsgi db check
      - name: Audit pinned dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/dependency-audit/bin/pip-audit" --cache-dir "$RUNNER_TEMP/dependency-audit-cache" --strict --disable-pip --no-deps -r requirements.txt
