{% extends "admin/layout.html" %}
{% block studio_content %}
  <header class="page-heading">
    <p class="eyebrow"><span class="rule-mark" aria-hidden="true"></span> Studio</p>
    <h1>Sign in</h1>
  </header>
  <form class="panel form-stack login-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="80" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="button button-primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form>
{% endblock %}
