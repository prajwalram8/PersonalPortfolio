<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta content="width=device-width, initial-scale=1.0" name="viewport">
      <title>{% block title %}Prajwal Ram Gowda{% endblock %}</title>
      <meta name="description" content="Prajwal Ram Gowda - Expert in Business Intelligence and Data Analytics. Skilled in Python, R, SQL, PowerBI, Azure, and Spark. Experienced in ETL Processes and Decision Science. MBA in Finance, based in Dubai.">
      <meta name="keywords" content="Business Intelligence, Data Analytics, Advanced Analytics, Data Strategy, ETL, Analytics Management, Decision Science, Python, R Programming, SQL, PowerBI, Data Visualization, Azure, Spark, MBA Finance, Dubai Professional">
      <!-- Favicons -->
      <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/favicons/apple-touch-icon.png') }}">
      <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicons/favicon-32x32.png') }}">
      <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicons/favicon-16x16.png') }}">
      <link rel="manifest" href="{{ url_for('static', filename='img/favicons/site.webmanifest') }}">
      <!-- Font Awesome icons (free version)-->
      <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
      <!-- Google fonts-->
      <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400;700&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
      <!-- Table CSS-->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
      <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css">
      <!-- Core theme CSS (includes Bootstrap)-->
      <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
      <!-- Global site tag (gtag.js) - Google Analytics -->
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-MP7Y9P8XT6"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-MP7Y9P8XT6');
      </script>
   </head>
   <body id="page-top">
      <!-- Navigation-->
      <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
         <div class="container-fluid">
            <a class="navbar-brand" href="#">PRG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
               <ul class="navbar-nav">
                  <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                  <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                  <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
                  <!--li class="nav-item"><a class="nav-link" href="{{ url_for('resume') }}">Resume</a></li-->
                  <li class="nav-item"><a class="nav-link" href="{{ url_for('blog') }}">Blog</a></li>
               </ul>
            </div>
         </div>
      </nav>
      {% block content %}
      <!-- Default content goes here -->
      {% endblock %}
      <!-- Footer-->
      <footer class="footer bg-black small text-center text-white-50 fixed-bottom">
         <div class="container px-4 px-lg-5">
            <div class="footer-content">
               <div class="footer-text">
                  Copyright &copy; Prajwal Ram Gowda 2023
               </div>
               <!-- Social Media Links -->
               <div class="social-icons">
                  <a href="https://www.linkedin.com/in/prajwal-ram-gowda/" target="_blank"><i class="fab fa-linkedin"></i></a>
                  <a href="https://github.com/prajwalram8" target="_blank"><i class="fab fa-github"></i></a>

            </div>
         </div>
      </footer>
