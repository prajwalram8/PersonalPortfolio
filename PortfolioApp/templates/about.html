{% extends "base.html" %}
{% block title %}About — Prajwal Ram Gowda{% endblock %}
{% block content %}
  <section class="shell page-section about-layout">
    <div>
      <header class="page-heading">
        <p class="eyebrow"><span class="rule-mark" aria-hidden="true"></span> About</p>
        <h1>Hi, I’m <em>Prajwal.</em></h1>
        <p>{{ profile.about_lead }}</p>
      </header>
      <div class="prose about-copy">
        {% for paragraph in paragraphs %}<p>{{ paragraph }}</p>{% endfor %}
      </div>
      <div class="hero-actions">
        <a class="button button-primary" href="{{ url_for('pages.resume') }}">View résumé <span class="arrow-up" aria-hidden="true"></span></a>
        <a class="text-link" href="{{ url_for('pages.contact') }}">Get in touch <span aria-hidden="true">→</span></a>
      </div>
    </div>
    <img class="about-portrait" src="{{ url_for('static', filename='img/about_2.jpg') }}" width="901" height="1350" alt="Portrait of Prajwal Ram Gowda">
  </section>
{% endblock %}
